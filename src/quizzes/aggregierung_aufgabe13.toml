prompt.prompt = "Welche Abfrage liefert gleichzeitig kleinsten und größten Tagesmietpreis?"
prompt.distractors = [
	"SELECT SUM(tagesmietpreis), AVG(tagesmietpreis) FROM fahrraeder;",
	"SELECT COUNT(tagesmietpreis), AVG(tagesmietpreis) FROM fahrraeder;",
	"SELECT MIN(tagesmietpreis) OR MAX(tagesmietpreis) FROM fahrraeder;"
]
answer.answer = "SELECT MIN(tagesmietpreis), MAX(tagesmietpreis) FROM fahrraeder;"
