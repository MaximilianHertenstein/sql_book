[[questions]]
type = "MultipleChoice"
prompt.prompt = "Welche Abfrage zählt Fahrräder pro Bezeichnung korrekt?"
prompt.distractors = [
	"SELECT bezeichnung, COUNT(fahrradNr) FROM fahrraeder;",
	"SELECT COUNT(fahrradNr) FROM fahrraeder GROUP bezeichnung;",
	"SELECT bezeichnung, COUNT(fahrradNr) FROM fahrraeder HAVING bezeichnung;"
]
answer.answer = "SELECT bezeichnung, COUNT(fahrradNr) FROM fahrraeder GROUP BY bezeichnung;"
context = "Gruppierung nach bezeichnung und Aggregation mit COUNT pro Gruppe."
