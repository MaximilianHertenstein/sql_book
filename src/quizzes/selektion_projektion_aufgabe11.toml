	"SELECT * FROM kunden WHERE vorname, name AND geschlecht = 'w';",
	"SELECT vorname, name FROM kunden WHERE geschlecht = w;",
	"SELECT vorname name FROM kunden WHERE geschlecht = 'w';"
]
answer.answer = "SELECT vorname, name FROM kunden WHERE geschlecht = 'w';"
